<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 1 JavaScript</title>
</head>
<body>
  <h2>Menghitung Luas Persegi Panjang, Bujur Sangkar, dan Segitiga</h2>

  <script>
    // Fungsi untuk menghitung luas persegi panjang, rumus nya = panjang * lebar
    function luasPersegiPanjang(panjang, lebar) {
      return panjang * lebar;
    }

    // Fungsi untuk menghitung luas bujur sangkar, rumusnya = sisi * sisi
    function luasBujurSangkar(sisi) {
      return sisi * sisi;
    }

    // Fungsi untuk menghitung luas segitiga, rumusnya = 1/2 * alas * tinggi
    function luasSegitiga(alas, tinggi) {
      return 0.5 * alas * tinggi;
    }

    // value atau nilai
    let panjang = 10;
    let lebar = 5;
    let sisi = 7;
    let alas = 8;
    let tinggi = 6;

    // Menampilkan hasil perhitungan tersebut ke halaman web
    document.write("<b>Hasil Perhitungan:</b><br>");
    document.write("Luas Persegi Panjang (" + panjang + " x " + lebar + ") = " + luasPersegiPanjang(panjang, lebar) + "<br>");
    document.write("Luas Bujur Sangkar (sisi " + sisi + ") = " + luasBujurSangkar(sisi) + "<br>");
    document.write("Luas Segitiga (alas " + alas + " x tinggi " + tinggi + ") = " + luasSegitiga(alas, tinggi) + "<br>");
  </script>
</body>
