<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 1 JavaScript</title>
</head>
<body>
  <h2>Menghitung Luas Persegi Panjang, Bujur Sangkar, dan Segitiga</h2>

  <script>
    // Luas Persegi Panjang
    let panjang = 10; // nilai panjang
    let lebar = 5;    // nilai lebar
    let luasPersegiPanjang = panjang * lebar; // rumus: panjang × lebar
    document.write("Diketahui Panjang " + panjang + "cm dan lebar adalah "+ lebar
    +"cm, Maka Luas Persegi panjang adalah: " + luasPersegiPanjang + "cm <br>");

    // Luas Bujur Sangkar
    let sisi = 6; // nilai sisi
    let luasBujurSangkar = sisi * sisi; // rumus: sisi × sisi
    document.write("Diketahui nilai sisi bujur sangkar adalah:  "+ sisi + 
    "cm, Maka luas bujur sangkar adalah: " + luasBujurSangkar + "cm <br>");

    // Luas Segitiga
    let alas = 8;   // nilai alas
    let tinggi = 12; // nilai tinggi
    let luasSegitiga = (alas * tinggi) / 2; // rumus: 1/2 × alas × tinggi
    document.write("Diketahui Alas " + alas + "cm dan tinggi "+ tinggi + "cm, Maka Luas segitiga adalah " 
    + luasSegitiga + "cm <br>");
  </script>
</body>
